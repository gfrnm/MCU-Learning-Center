<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Pembelajaran</title>

<link rel="stylesheet" href="style.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<div class="container nav-content">

<div class="logo">

<i class="fa-solid fa-graduation-cap"></i>
MCU Learning Center

</div>

<a href="index.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>
Kembali

</a>

</div>

</nav>

<!-- HEADER DASHBOARD -->

<section class="dashboard-hero">

<div class="container">

<div class="dashboard-card">

<div class="dashboard-badge">

📚 Dashboard Pembelajaran

</div>

<h1 id="dashboardTitle">

Loading...

</h1>

<p>

Akses seluruh materi, PPT,
dan rekaman pembelajaran
dalam satu tempat.

</p>

</div>

</div>

</section>

<!-- MATERI -->

<section class="section">

<div class="container">

<h2>

Daftar Materi

</h2>

<div class="timeline-modern">

<div id="timeline">

</div>

</div>

</div>

</section>

<!-- FOOTER -->

<footer>

<div class="container">

<h3>

MCU Bimbel Learning Center

</h3>

<p>

Learning • Growth • Success

</p>

</div>

</footer>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwVinCt06UJxDWd9yLcsHuWJWqrCDmBwEvQCxoLQ9MLCGVzFSXg93Bk9f0joIGJ3cC_/exec";

async function loadDashboard() {

const params =
new URLSearchParams(
window.location.search
);

const program =
params.get("program");

const batch =
params.get("batch");

console.log("PROGRAM:", program);
console.log("BATCH:", batch);

if(!program || !batch){

    document
    .getElementById("dashboardTitle")
    .innerText =
    "Data Tidak Ditemukan";

    document
    .getElementById("timeline")
    .innerHTML = `
    <div class="timeline-item">
        <h3>Program atau Batch tidak ditemukan</h3>
        <p>
            Silakan kembali ke halaman utama
            dan pilih program kembali.
        </p>
    </div>
    `;

    return;
}

document
.getElementById("dashboardTitle")
.innerText =
program + " - " + batch;

try {

const response =
await fetch(API_URL);

const data =
await response.json();

const materi =
data.materi.filter(item =>

item.program === program &&
item.bulan === batch

);

let html = "";

materi.forEach((item,index) => {

html += `

<div class="timeline-row">

    <div class="timeline-marker">

        <div class="timeline-number">

            ${(index + 1).toString().padStart(2,'0')}

        </div>

    </div>

    <div class="timeline-item modern">

        <div class="tanggal">

            📅 ${item.tanggal}

        </div>

        <h3>

            Pertemuan ${item.pertemuan}

        </h3>

        <p>

            ${item.materi}

        </p>

        <div class="btn-group">

            <a
            href="${item.ppt}"
            target="_blank"
            class="btn ppt">

                📄 PPT

            </a>

            <a
            href="${item.rekaman}"
            target="_blank"
            class="btn video">

                ▶ Rekaman

            </a>

        </div>

    </div>

</div>

`;

});



document
.getElementById("timeline")
.innerHTML =
html;

}
catch(error){

console.error(error);

}

}

loadDashboard();

</script>

</body>

<div id="loadingScreen">

    <div class="loader"></div>

    <h3>Memuat Materi...</h3>

    <p>Mohon tunggu sebentar</p>

</div>

</html>
